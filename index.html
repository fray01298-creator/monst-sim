<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>シミュレーター v0.9</title>
<style>
  :root {
    --bg: #12151c;
    --panel: #1c212b;
    --border: #2d3545;
    --text: #eef2f7;
    --muted: #9aa5b4;
    --accent: #ff9800;
    --accent2: #00bcd4;
    --pierce: #69f0ae;
    --danger: #ef5350;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
    overflow: hidden;
  }
  html, body { height: 100dvh; overscroll-behavior: none; }
  .app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: row;
  }
  .canvas-wrap {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  /* HUD：壁枠の外（上側の余白）に自動配置 */
  .hud-badge {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(18, 21, 28, 0.82);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 9px;
    font-size: 12px;
    line-height: 1.4;
    pointer-events: none;
    max-width: calc(100% - 16px);
    white-space: nowrap;
    z-index: 5;
  }
  .hud-badge strong { color: var(--accent); font-size: 15px; }
  .pill {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    margin-left: 4px;
  }
  .pill-reflect { background: rgba(255, 152, 0, 0.22); color: #ffb74d; border: 1px solid rgba(255, 152, 0, 0.5); }
  .pill-pierce { background: rgba(105, 240, 174, 0.2); color: #69f0ae; border: 1px solid rgba(105, 240, 174, 0.5); }
  .pill-practice { background: rgba(233, 30, 99, 0.25); color: #f48fb1; border: 1px solid rgba(233, 30, 99, 0.55); }
  .hud-gimmick {
    font-size: 11px;
    color: #cfd8dc;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    white-space: normal;
  }
  .hud-gimmick:empty { display: none; }
  .mode-toast {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s;
    z-index: 6;
    white-space: nowrap;
    max-width: calc(100% - 16px);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mode-toast.show { opacity: 1; }

  /* クイックバー（画面下） */
  .quickbar {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(8px + env(safe-area-inset-bottom));
    display: flex;
    gap: 4px;
    align-items: center;
    background: rgba(18, 21, 28, 0.85);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    z-index: 7;
    max-width: calc(100% - 8px);
  }
  .qb {
    background: #28303f;
    color: var(--text);
    border: 1px solid #3a4559;
    border-radius: 8px;
    min-width: 34px;
    height: 38px;
    padding: 0 6px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .qb.active { background: var(--accent); color: #111; border-color: var(--accent); }
  .qb.active-play { background: #29b6f6; color: #07131a; border-color: #29b6f6; }
  .qb-sep { width: 1px; height: 26px; background: var(--border); margin: 0 1px; }
  .qb-angle { font-size: 13px; min-width: 30px; }
  .drop-hint {
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 10px;
    color: rgba(255,255,255,0.45);
    pointer-events: none;
  }

  /* 設定パネル */
  .controls {
    flex: 0 0 auto;
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 10px 12px calc(16px + env(safe-area-inset-bottom));
    padding-top: calc(10px + env(safe-area-inset-top));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 420px;
    z-index: 20;
  }
  .app.panel-closed .controls { display: none; }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    font-size: 14px;
    position: sticky;
    top: calc(-10px - env(safe-area-inset-top));
    background: var(--panel);
    padding: 4px 0;
    z-index: 2;
  }
  .panel-backdrop { display: none; }
  @media (max-width: 899px) {
    .controls {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: min(88vw, 400px);
      transform: translateX(0);
      transition: transform .22s ease;
      box-shadow: -8px 0 24px rgba(0,0,0,.5);
    }
    .app.panel-closed .controls { display: flex; transform: translateX(105%); }
    .panel-backdrop {
      display: block;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 19;
    }
    .app.panel-closed .panel-backdrop { display: none; }
    .controls.peek { opacity: .15; }
    .drop-hint { display: none; }
  }
  .row {
    display: flex;
    gap: 5px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    background: #28303f;
    color: var(--text);
    border: 1px solid #3a4559;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    flex: 1 1 auto;
    text-align: center;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(1px); }
  .btn.active { background: var(--accent); color: #111; border-color: var(--accent); }
  .btn.active-pierce { background: var(--pierce); color: #0b1912; border-color: var(--pierce); }
  .btn.active-practice { background: #ec407a; color: #fff; border-color: #ec407a; }
  .btn.active-play { background: #29b6f6; color: #07131a; border-color: #29b6f6; }
  .btn.danger { background: rgba(239, 83, 80, 0.18); border-color: rgba(239, 83, 80, 0.5); color: #ff8a80; }
  .btn-sm { padding: 5px 7px; font-size: 11px; flex: 0 0 auto; }

  .group {
    background: rgba(0,0,0,0.22);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 9px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    color: var(--muted);
    gap: 6px;
  }
  .group-header span.val {
    color: var(--text);
    font-weight: bold;
    font-variant-numeric: tabular-nums;
  }
  select, input[type="text"] {
    background: #252c3a;
    color: var(--text);
    border: 1px solid #3c475c;
    border-radius: 5px;
    padding: 4px 6px;
    font-size: 11.5px;
  }
  input[type="text"]::placeholder {
    color: #788496;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    height: 20px;
    margin: 0;
  }
  .fine-btns {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }
  .fine-btns button {
    background: #252c3a;
    color: var(--text);
    border: 1px solid #384256;
    border-radius: 5px;
    padding: 5px 0;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .fine-btns button:active { background: var(--accent); color: #111; }
  .wall-gimmick-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .wg-row {
    display: grid;
    grid-template-columns: 56px 76px 1fr 1fr;
    gap: 4px;
    align-items: center;
    background: #222836;
    padding: 4px 6px;
    border-radius: 5px;
    font-size: 11px;
  }
  .wg-row label {
    display: flex;
    flex-direction: column;
    font-size: 10px;
    color: var(--muted);
  }
  .wg-row input[type="range"] {
    height: 16px;
  }
  .embed-box {
    width: 100%;
    min-height: 68px;
    background: #10141c;
    color: #a5d6a7;
    border: 1px solid #334055;
    border-radius: 6px;
    padding: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10.5px;
    resize: vertical;
    display: none;
  }
  .embed-box.open {
    display: block;
  }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="app panel-closed" id="app">
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="simCanvas"></canvas>
    <div class="hud-badge" id="hudBadge">
      角度: <strong id="angleText">-62.00°</strong>
      <span id="typeBadge" class="pill pill-reflect">反射</span>
      <span id="practiceBadge" class="pill pill-practice" style="display:none;">練習(予測OFF)</span>
      <div class="hud-gimmick" id="hudGimmick"></div>
    </div>
    <div class="mode-toast" id="modeToast"><span id="modeDesc">画面ドラッグで引っ張り方向を調整</span></div>
    <div class="quickbar" id="quickbar">
      <button class="qb active" data-mode="pull" title="引っ張り">🎯</button>
      <button class="qb" data-mode="ball" title="キャラ移動">⚪</button>
      <button class="qb" data-mode="obs" title="障害物">🧱</button>
      <button class="qb" data-mode="wall" title="壁枠">⬜</button>
      <button class="qb" data-mode="img" title="画像調整">🖼</button>
      <span class="qb-sep"></span>
      <button class="qb qb-angle" id="qbMinus" title="角度 −（長押しで連続）">−</button>
      <button class="qb qb-angle" id="qbPlus" title="角度 ＋（長押しで連続）">＋</button>
      <button class="qb" id="qbPlay" title="再生/停止">▶</button>
      <span class="qb-sep"></span>
      <button class="qb" id="qbSettings" title="設定">⚙</button>
    </div>
    <div class="drop-hint">PC: Ctrl+V / ドロップで画像読込</div>
  </div>

  <div class="panel-backdrop" id="panelBackdrop"></div>
  <div class="controls" id="settingsPanel">
    <div class="panel-head">
      <span>⚙ 設定</span>
      <span style="display:flex; gap:6px;">
        <button class="btn btn-sm" id="btnPeek" title="押している間だけパネルを透明にして盤面を確認">👁 透かす</button>
        <button class="btn btn-sm" id="btnClosePanel">✕ 閉じる</button>
      </span>
    </div>
    <!-- 1段目：画像＆撃種＆練習モード -->
    <div class="row">
      <label class="btn btn-sm" for="fileInput">📷 画像</label>
      <input type="file" id="fileInput" accept="image/*">
      <button class="btn btn-sm" id="btnDummy">模擬</button>
      <button class="btn active" id="btnReflect">反射</button>
      <button class="btn" id="btnPierce">貫通</button>
      <button class="btn" id="btnPractice" title="予測線を隠してアニメーションで答え合わせ">🏋️ 練習</button>
    </div>

    <!-- 2段目：アニメーション再生 -->
    <div class="group">
      <div class="group-header">
        <span>軌道アニメーション</span>
        <span class="val" id="animStatus">停止中</span>
      </div>
      <div class="row">
        <button class="btn" id="btnPlay">▶ 再生</button>
        <button class="btn btn-sm" id="btnResetAnim">↺ リセット</button>
        <select id="speedSelect" title="再生速度">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.5">1.5x</option>
          <option value="2.5">2.5x</option>
        </select>
      </div>
    </div>

    <!-- 3段目：自作プリセット（保存・読込・削除・HTML埋込用コード出力） -->
    <div class="group">
      <div class="group-header">
        <span>マイプリセット（ブラウザ保存＆HTML埋込可）</span>
        <span class="val" id="presetStatus">0件</span>
      </div>
      <div class="row">
        <select id="presetSelect" style="flex:1 1 55%;"></select>
        <button class="btn btn-sm active" id="loadPresetBtn">読込</button>
        <button class="btn btn-sm danger" id="delPresetBtn">削除</button>
      </div>
      <div class="row">
        <input type="text" id="presetNameInput" placeholder="プリセット名（例: 〇〇 B1）" style="flex:1 1 50%;">
        <button class="btn btn-sm" id="savePresetBtn">＋ 保存</button>
        <button class="btn btn-sm" id="exportEmbedBtn" title="EMBEDDED_PRESETSに貼るコードを出力">📋 埋込コード</button>
      </div>
      <textarea id="embedCodeBox" class="embed-box" readonly placeholder="「📋 埋込コード」を押すと、HTML内の EMBEDDED_PRESETS に貼り付けるコードが出ます"></textarea>
    </div>

    <!-- 4段目：操作モード切替 -->
    <div class="row">
      <button class="btn active" id="modePull">🎯 引っ張り</button>
      <button class="btn" id="modeBall">⚪ キャラ</button>
      <button class="btn" id="modeObs">🧱 障害物</button>
      <button class="btn" id="modeWall">⬜ 壁枠</button>
      <button class="btn" id="modeImg">🖼 画像</button>
    </div>

    <!-- 画像の位置・サイズ調整 -->
    <div class="group">
      <div class="group-header">
        <span>画像調整（🖼画像モード：ドラッグ移動 / ホイール・ピンチで拡大縮小）</span>
        <span class="val" id="imgZoomVal">画像なし</span>
      </div>
      <div class="row">
        <button class="btn btn-sm" id="imgFitW">幅に合わせる</button>
        <button class="btn btn-sm" id="imgFitH">高さに合わせる</button>
        <button class="btn btn-sm" id="imgZoomOut">－</button>
        <button class="btn btn-sm" id="imgZoomIn">＋</button>
      </div>
    </div>

    <!-- 5段目：障害物追加・削除 -->
    <div class="group">
      <div class="group-header">
        <span>障害物（円＝敵 / 四角＝ブロック）</span>
        <span class="val" id="obsCount">0個</span>
      </div>
      <div class="row">
        <button class="btn btn-sm" id="addCircle">＋ 円(敵)</button>
        <button class="btn btn-sm" id="addRect">＋ 四角</button>
        <button class="btn btn-sm danger" id="delObs">削除</button>
        <button class="btn btn-sm" id="clearObs">全消去</button>
      </div>
    </div>

    <!-- 6段目：壁ギミック（PUW部分設置 / HCW） -->
    <div class="group">
      <div class="group-header">
        <span>壁ギミック（PUWは開始位置＆長さで部分設置可）</span>
        <button class="btn btn-sm" id="clearWallGimmick" style="padding:2px 6px; font-size:10px;">全解除</button>
      </div>
      <div class="wall-gimmick-list" id="wallGimmickList"></div>
    </div>

    <!-- 7段目：角度調整 -->
    <div class="group">
      <div class="group-header">
        <span>発射角度（0°=右, -90°=上）</span>
        <div style="display:flex; align-items:center; gap:6px;">
          <select id="stepSelect">
            <option value="0.25" selected>0.25°(1440分割)</option>
            <option value="0.1">0.1°</option>
            <option value="1">1°</option>
          </select>
          <span class="val" id="angleVal">-62.00°</span>
        </div>
      </div>
      <input type="range" id="angleSlider" min="-180" max="180" step="0.25" value="-62">
      <div class="fine-btns" id="fineBtns"></div>
    </div>

    <!-- 8段目：反射数（1〜16）＆ 弾の半径 ＆ 壁枠比率固定 -->
    <div class="group">
      <div class="group-header">
        <span>反射数（1〜16回）</span>
        <span class="val" id="bounceVal">6 回</span>
      </div>
      <input type="range" id="bounceSlider" min="1" max="16" step="1" value="6">

      <div class="group-header" style="margin-top:2px;">
        <span>弾（キャラ）の半径（壁枠の幅が基準）</span>
        <span class="val" id="radiusVal">壁幅の 3.8%</span>
      </div>
      <input type="range" id="radiusSlider" min="0" max="12" step="0.1" value="3.8">

      <div class="group-header" style="margin-top:2px;">
        <label style="color:var(--text); cursor:pointer; font-size:11.5px; font-weight:600;">
          <input type="checkbox" id="chkSquareWall" checked> 壁枠を 縦9:横8 固定
        </label>
        <label style="color:var(--text); cursor:pointer; font-size:11px;">
          <input type="checkbox" id="chkShowEffective" checked> 実反射ライン
        </label>
        <label style="color:var(--text); cursor:pointer; font-size:11px;" title="反射した瞬間のキャラ位置と、跳ね返りの基準線（法線）を表示">
          <input type="checkbox" id="chkShowContacts" checked> 接触表示
        </label>
      </div>
      <div class="row">
        <button class="btn btn-sm" id="presetIphone">iPhone 15 Pro 9:8枠</button>
        <button class="btn btn-sm" id="presetSquareCenter">中央 9:8枠</button>
      </div>
    </div>
  </div>
</div>

    //   obstacles: [
    //     { type: "circle", u: 0.5, v: 0.35, ur: 0.08, label: "敵1" }
    //   ]
    // }
  ];

  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvasWrap');

  const STORAGE_KEY = 'monst_sim_v9_state';
  const OLD_STORAGE_KEYS = ['monst_sim_v7_state', 'monst_sim_v6_state'];
  const PRESETS_KEY = 'monst_sim_v6_user_presets';

  // 壁枠の縦横比（縦 : 横 = 9 : 8 → 高さ = 幅 * 1.125）
  const WALL_H_PER_W = 9 / 8;

  function makeDefaultWallGimmicks() {
    return {
      top:    { type: 'none', start: 0.15, length: 0.70 },
      bottom: { type: 'none', start: 0.15, length: 0.70 },
      left:   { type: 'none', start: 0.15, length: 0.70 },
      right:  { type: 'none', start: 0.15, length: 0.70 }
    };
  }

  const defaultState = {
    shotType: 'reflect',
    practiceMode: false,
    wall: { left: 0.042, right: 0.958, top: 0.224, bottom: 0.699 }, // 縦9:横8
    wallGimmicks: makeDefaultWallGimmicks(),
    lockWallRatio: true,
    ball: { x: 0.50, y: 0.58 },
    angleDeg: -62.0,
    angleStep: 0.25,
    bounces: 6,
    radiusWallRatio: 0.038, // キャラ半径＝壁枠の幅 × この値
    showContacts: true,
    showEffective: true,
    obstacles: []
  };

  function normalizeWallGimmicks(raw) {
    const base = makeDefaultWallGimmicks();
    if (!raw) return base;
    ['top', 'bottom', 'left', 'right'].forEach(side => {
      const item = raw[side];
      if (!item) return;
      if (typeof item === 'string') {
        base[side].type = item;
      } else {
        base[side].type = item.type || 'none';
        base[side].start = Math.max(0, Math.min(0.95, parseFloat(item.start) || 0));
        base[side].length = Math.max(0.05, Math.min(1 - base[side].start, parseFloat(item.length) || 1.0));
      }
    });
    return base;
  }

  let state = loadState();
  let userPresets = loadUserPresets();
  let mode = 'pull';
  let selectedObsId = state.obstacles[0] ? state.obstacles[0].id : null;
  let bgImage = null;
  let safeProbe = null;
  // キャンバスの縦横比は固定（iPhone 15 Pro 画面比 1179×2556）
  const CANVAS_W = 1179;
  const CANVAS_H = 2556;
  let imgView = { x: 0, y: 0, s: 1 };
  const activePointers = new Map();
  let pinchStart = null;
  let imgDragStart = null;

  let isPlaying = false;
  let animSpeed = 1.0;
  let animDistance = 0;
  let lastFrameTime = null;
  let rafId = null;

  let isDragging = false;
  let dragStart = { x: 0, y: 0 };
  let activeWallHandle = null;
  let startWall = null;
  let startScene = null;
  let activeObsHandle = null;
  let startObs = null;

  function loadState() {
    try {
      let saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!saved) {
        for (const key of OLD_STORAGE_KEYS) {
          const old = JSON.parse(localStorage.getItem(key));
          if (old && old.wall && old.ball) {
            saved = old;
            if (typeof old.squareWall === 'boolean' && typeof old.lockWallRatio !== 'boolean') {
              saved.lockWallRatio = old.squareWall;
            }
            if (typeof old.radiusRatio === 'number' && typeof old.radiusWallRatio !== 'number') {
              const ww = Math.max(0.05, (old.wall.right || 0.958) - (old.wall.left || 0.042));
              saved.radiusWallRatio = old.radiusRatio / ww;
            }
            break;
          }
        }
      }
      if (saved && saved.wall && saved.ball) {
        return {
          ...defaultState,
          ...saved,
          bounces: Math.max(1, Math.min(16, parseInt(saved.bounces, 10) || 6)),
          wall: { ...defaultState.wall, ...saved.wall },
          wallGimmicks: normalizeWallGimmicks(saved.wallGimmicks),
          ball: { ...defaultState.ball, ...saved.ball },
          obstacles: Array.isArray(saved.obstacles) ? saved.obstacles : []
        };
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(defaultState));
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function loadUserPresets() {
    try {
      const arr = JSON.parse(localStorage.getItem(PRESETS_KEY));
      return Array.isArray(arr) ? arr : [];
    } catch (e) {
      return [];
    }
  }

  function saveUserPresets() {
    try {
      localStorage.setItem(PRESETS_KEY, JSON.stringify(userPresets));
    } catch (e) {}
  }

  // 現在の状態を「壁枠内の相対座標(u, v)」へ変換（埋込・プリセット用）
  function buildPresetData(name) {
    const wl = state.wall.left;
    const wr = state.wall.right;
    const wt = state.wall.top;
    const wb = state.wall.bottom;
    const ww = Math.max(0.01, wr - wl);
    const wh = Math.max(0.01, wb - wt);

    return {
      name: name || ('プリセット ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })),
      shotType: state.shotType,
      ball: {
        u: Number(((state.ball.x - wl) / ww).toFixed(4)),
        v: Number(((state.ball.y - wt) / wh).toFixed(4))
      },
      wallGimmicks: normalizeWallGimmicks(state.wallGimmicks),
      obstacles: state.obstacles.map((o, i) => {
        if (o.type === 'circle') {
          return {
            type: 'circle',
            u: Number(((o.x - wl) / ww).toFixed(4)),
            v: Number(((o.y - wt) / wh).toFixed(4)),
            ur: Number((o.r / ww).toFixed(4)),
            label: o.label || ('敵' + (i + 1))
          };
        } else {
          return {
            type: 'rect',
            u: Number(((o.x - wl) / ww).toFixed(4)),
            v: Number(((o.y - wt) / wh).toFixed(4)),
            uw: Number((o.w / ww).toFixed(4)),
            uh: Number((o.h / wh).toFixed(4)),
            label: o.label || 'ブロック'
          };
        }
      })
    };
  }

  function applyPresetData(pData) {
    if (!pData) return;
    const wl = state.wall.left;
    const wr = state.wall.right;
    const wt = state.wall.top;
    const wb = state.wall.bottom;
    const ww = wr - wl;
    const wh = wb - wt;

    state.shotType = pData.shotType === 'pierce' ? 'pierce' : 'reflect';
    state.wallGimmicks = normalizeWallGimmicks(pData.wallGimmicks);
    if (pData.ball) {
      state.ball = {
        x: wl + (pData.ball.u ?? 0.5) * ww,
        y: wt + (pData.ball.v ?? 0.7) * wh
      };
    }
    state.obstacles = Array.isArray(pData.obstacles)
      ? pData.obstacles.map((o, idx) => {
          const id = 'pr_' + Date.now() + '_' + idx;
          if (o.type === 'circle') {
            return {
              id,
              type: 'circle',
              x: wl + (o.u ?? 0.5) * ww,
              y: wt + (o.v ?? 0.4) * wh,
              r: (o.ur ?? 0.06) * ww,
              label: o.label || ('敵' + (idx + 1))
            };
          } else {
            return {
              id,
              type: 'rect',
              x: wl + (o.u ?? 0.5) * ww,
              y: wt + (o.v ?? 0.5) * wh,
              w: (o.uw ?? 0.22) * ww,
              h: (o.uh ?? 0.04) * wh,
              label: o.label || 'ブロック'
            };
          }
        })
      : [];
    selectedObsId = state.obstacles[0] ? state.obstacles[0].id : null;
    resetAnim();
    buildWallGimmickUI();
    syncUI();
    saveState();
    render();
  }

  // プリセットUI制御（EMBEDDED_PRESETS + ユーザー保存プリセット）
  const presetSelect = document.getElementById('presetSelect');
  const presetNameInput = document.getElementById('presetNameInput');
  const presetStatus = document.getElementById('presetStatus');
  const embedCodeBox = document.getElementById('embedCodeBox');

  function getAllPresets() {
    const emb = (Array.isArray(EMBEDDED_PRESETS) ? EMBEDDED_PRESETS : []).map((p, i) => ({
      ...p,
      _source: 'embedded',
      _index: i
    }));
    const usr = userPresets.map((p, i) => ({
      ...p,
      _source: 'user',
      _index: i
    }));
    return [...emb, ...usr];
  }

  function refreshPresetDropdown(selectValue = null) {
    const all = getAllPresets();
    presetSelect.innerHTML = '';
    if (all.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '（保存済みプリセットなし）';
      presetSelect.appendChild(opt);
    } else {
      all.forEach((p, idx) => {
        const opt = document.createElement('option');
        opt.value = String(idx);
        const prefix = p._source === 'embedded' ? '[埋込] ' : '';
        opt.textContent = prefix + (p.name || ('プリセット' + (idx + 1)));
        presetSelect.appendChild(opt);
      });
      if (selectValue !== null) {
        presetSelect.value = String(selectValue);
      }
    }
    presetStatus.textContent = `埋込:${EMBEDDED_PRESETS.length} / 保存:${userPresets.length}`;
  }

  document.getElementById('savePresetBtn').addEventListener('click', () => {
    const name = presetNameInput.value.trim();
    const data = buildPresetData(name);
    userPresets.push(data);
    saveUserPresets();
    presetNameInput.value = '';
    const newIdx = EMBEDDED_PRESETS.length + userPresets.length - 1;
    refreshPresetDropdown(newIdx);
  });

  document.getElementById('loadPresetBtn').addEventListener('click', () => {
    const all = getAllPresets();

    if (!isNaN(idx) && all[idx]) {

    }

  document.getElementById('delPresetBtn').addEventListener('click', () => {
    const all = getAllPresets();
    const idx = parseInt(presetSelect.value, 10);
    if (isNaN(idx) || !all[idx]) return;
    const item = all[idx];
    if (item._source === 'embedded') {
      alert('HTMLに埋め込み済みのプリセットはコード上から編集してください。');
      return;
    }
    userPresets.splice(item._index, 1);
    saveUserPresets();
    refreshPresetDropdown();
  });

  document.getElementById('exportEmbedBtn').addEventListener('click', () => {
    const name = presetNameInput.value.trim() || 'マイステージ';

    const jsonSnippet = JSON.stringify(data, null, 2) + ',';

    }

  function quantizeAngle(deg) {
    const step = state.angleStep || 0.25;
    let a = ((deg + 180) % 360 + 360) % 360 - 180;
    const q = Math.round(a / step) * step;
    let wrapped = ((q + 180) % 360 + 360) % 360 - 180;
    return Number(wrapped.toFixed(2));
  }

  function formatAngle(deg) {
    const step = state.angleStep || 0.25;
    if (step >= 1) return deg.toFixed(0) + '°';
    if (step >= 0.25) return deg.toFixed(2) + '°';
    return deg.toFixed(1) + '°';
  }

  // 壁枠が変わったら、キャラ・障害物を壁枠に追従させる
  function remapScene(fromWall, toWall, scene) {
    const ow = Math.max(1e-6, fromWall.right - fromWall.left);
    const oh = Math.max(1e-6, fromWall.bottom - fromWall.top);
    const sx = (toWall.right - toWall.left) / ow;
    const sy = (toWall.bottom - toWall.top) / oh;
    const mx = x => toWall.left + (x - fromWall.left) * sx;
    const my = y => toWall.top + (y - fromWall.top) * sy;
    state.ball = { x: mx(scene.ball.x), y: my(scene.ball.y) };
    state.obstacles = scene.obstacles.map(o => {
      const n = { ...o, x: mx(o.x), y: my(o.y) };
      if (o.type === 'circle') n.r = o.r * sx;
      else { n.w = o.w * sx; n.h = o.h * sy; }
      return n;
    });
  }
  function snapshotScene() {
    return { ball: { ...state.ball }, obstacles: state.obstacles.map(o => ({ ...o })) };
  }
  function setWall(newWall, fromWall = state.wall, scene = snapshotScene()) {
    remapScene(fromWall, newWall, scene);
    state.wall = { ...newWall };
  }

  // ---- [v0.9] 壁枠を 縦9:横8（高さ = 幅 * 9/8）に整える
  function enforceWallAspect(wPx, hPx, anchor = 'center', targetWall = state.wall, fromWall = null, scene = null) {
    if (!state.lockWallRatio) {
      if (fromWall) setWall(targetWall, fromWall, scene);
      else state.wall = { ...targetWall };
      return;
    }
    let left = targetWall.left * wPx;
    let right = targetWall.right * wPx;
    let top = targetWall.top * hPx;
    let bottom = targetWall.bottom * hPx;

    let ww = Math.max(40, right - left);
    let hh = Math.max(45, bottom - top);
    const maxW = Math.min(wPx, hPx / WALL_H_PER_W);

    // どのハンドルを動かしているかに応じて基準辺を決める
    let newW, newH;
    if (anchor === 'top' || anchor === 'bottom') {
      newH = Math.min(hPx, Math.max(45, hh));
      newW = newH / WALL_H_PER_W;
      if (newW > maxW) { newW = maxW; newH = newW * WALL_H_PER_W; }
    } else if (anchor === 'left' || anchor === 'right') {
      newW = Math.min(maxW, Math.max(40, ww));
      newH = newW * WALL_H_PER_W;
    } else {
      newW = Math.min(maxW, Math.max(ww, hh / WALL_H_PER_W));
      newH = newW * WALL_H_PER_W;
    }

    if (anchor === 'top') {
      const cx = (left + right) / 2;
      left = cx - newW / 2; right = cx + newW / 2; bottom = top + newH;
    } else if (anchor === 'bottom') {
      const cx = (left + right) / 2;
      left = cx - newW / 2; right = cx + newW / 2; top = bottom - newH;
    } else if (anchor === 'left') {
      const cy = (top + bottom) / 2;
      top = cy - newH / 2; bottom = cy + newH / 2; right = left + newW;
    } else if (anchor === 'right') {
      const cy = (top + bottom) / 2;
      top = cy - newH / 2; bottom = cy + newH / 2; left = right - newW;
    } else {
      const cx = (left + right) / 2;
      const cy = (top + bottom) / 2;
      left = cx - newW / 2; right = cx + newW / 2;
      top = cy - newH / 2; bottom = cy + newH / 2;
    }

    if (left < 0) { right -= left; left = 0; }
    if (right > wPx) { left -= (right - wPx); right = wPx; }
    if (top < 0) { bottom -= top; top = 0; }
    if (bottom > hPx) { top -= (bottom - hPx); bottom = hPx; }

    const newWall = {
      left: Math.max(0, Math.min(1, left / wPx)),
      right: Math.max(0, Math.min(1, right / wPx)),
      top: Math.max(0, Math.min(1, top / hPx)),
      bottom: Math.max(0, Math.min(1, bottom / hPx))
    };
    if (fromWall) {
      setWall(newWall, fromWall, scene);
    } else {
      const d = Math.abs(newWall.left - state.wall.left) + Math.abs(newWall.right - state.wall.right) +
                Math.abs(newWall.top - state.wall.top) + Math.abs(newWall.bottom - state.wall.bottom);
      if (d > 1e-4) setWall(newWall);
    }
  }

  const wallGimmickList = document.getElementById('wallGimmickList');
  const sideLabels = { top: '⬆ 上壁', bottom: '⬇ 下壁', left: '⬅ 左壁', right: '➡ 右壁' };

  function buildWallGimmickUI() {
    wallGimmickList.innerHTML = '';
    ['top', 'bottom', 'left', 'right'].forEach(side => {
      const cfg = state.wallGimmicks[side];
      const row = document.createElement('div');
      row.className = 'wg-row';

      const title = document.createElement('span');
      title.style.fontWeight = '600';
      title.textContent = sideLabels[side];

      const sel = document.createElement('select');
      sel.innerHTML = `
        <option value="none">なし</option>
        <option value="puw">PUW</option>
        <option value="hcw">HCW</option>
      `;
      sel.value = cfg.type;

      const startLbl = document.createElement('label');
      const startRange = document.createElement('input');
      startRange.type = 'range';
      startRange.min = '0';
      startRange.max = '0.9';
      startRange.step = '0.05';
      startRange.value = String(cfg.start);
      const startText = document.createElement('span');
      startText.textContent = `始:${Math.round(cfg.start * 100)}%`;
      startLbl.append(startText, startRange);

      const lenLbl = document.createElement('label');
      const lenRange = document.createElement('input');
      lenRange.type = 'range';
      lenRange.min = '0.1';
      lenRange.max = '1.0';
      lenRange.step = '0.05';
      lenRange.value = String(cfg.length);
      const lenText = document.createElement('span');
      lenText.textContent = `幅:${Math.round(cfg.length * 100)}%`;
      lenLbl.append(lenText, lenRange);

      const updateCfg = () => {
        cfg.type = sel.value;
        cfg.start = parseFloat(startRange.value);
        cfg.length = Math.min(1 - cfg.start, Math.max(0.05, parseFloat(lenRange.value)));
        lenRange.value = String(cfg.length);
        startText.textContent = `始:${Math.round(cfg.start * 100)}%`;
        lenText.textContent = `幅:${Math.round(cfg.length * 100)}%`;
        saveState();
        render();
      };

      sel.addEventListener('change', updateCfg);
      startRange.addEventListener('input', updateCfg);
      lenRange.addEventListener('input', updateCfg);

      row.append(title, sel, startLbl, lenLbl);
      wallGimmickList.appendChild(row);
    });
  }

  const angleText = document.getElementById('angleText');
  const angleVal = document.getElementById('angleVal');
  const angleSlider = document.getElementById('angleSlider');
  const stepSelect = document.getElementById('stepSelect');
  const fineBtnsWrap = document.getElementById('fineBtns');
  const bounceVal = document.getElementById('bounceVal');
  const bounceSlider = document.getElementById('bounceSlider');
  const radiusVal = document.getElementById('radiusVal');
  const radiusSlider = document.getElementById('radiusSlider');
  const chkSquareWall = document.getElementById('chkSquareWall');
  const chkShowEffective = document.getElementById('chkShowEffective');
  const chkShowContacts = document.getElementById('chkShowContacts');
  const imgZoomVal = document.getElementById('imgZoomVal');
  const modeDesc = document.getElementById('modeDesc');
  const typeBadge = document.getElementById('typeBadge');
  const practiceBadge = document.getElementById('practiceBadge');
  const hudGimmick = document.getElementById('hudGimmick');
  const btnReflect = document.getElementById('btnReflect');
  const btnPierce = document.getElementById('btnPierce');
  const btnPractice = document.getElementById('btnPractice');
  const obsCount = document.getElementById('obsCount');

  function buildFineButtons() {
    const step = state.angleStep || 0.25;
    const coarse = step >= 1 ? 5 : 1;
    const deltas = [-coarse, -step, step, coarse];
    fineBtnsWrap.innerHTML = '';
    deltas.forEach(d => {
      const b = document.createElement('button');
      const label = (d > 0 ? '+' : '') + (Number.isInteger(d) ? d : d.toFixed(2)) + '°';
      b.textContent = label;
      b.addEventListener('click', () => {
        state.angleDeg = quantizeAngle(state.angleDeg + d);
        resetAnim();
        syncUI();
        saveState();
        render();
      });
      fineBtnsWrap.appendChild(b);
    });
  }

  function syncUI() {
    state.angleDeg = quantizeAngle(state.angleDeg);
    const step = state.angleStep || 0.25;
    stepSelect.value = String(step);
    angleSlider.step = String(step);
    angleSlider.value = state.angleDeg;

    const aStr = formatAngle(state.angleDeg);
    angleText.textContent = aStr;
    angleVal.textContent = aStr;

    const isPierce = state.shotType === 'pierce';
    btnReflect.classList.toggle('active', !isPierce);
    btnPierce.classList.toggle('active-pierce', isPierce);
    typeBadge.textContent = isPierce ? '貫通' : '反射';
    typeBadge.className = 'pill ' + (isPierce ? 'pill-pierce' : 'pill-reflect');

    btnPractice.classList.toggle('active-practice', state.practiceMode);
    practiceBadge.style.display = state.practiceMode ? 'inline-block' : 'none';

    state.bounces = Math.max(1, Math.min(16, state.bounces));
    bounceVal.textContent = state.bounces + ' 回';
    bounceSlider.value = state.bounces;

    radiusVal.textContent = '壁幅の ' + (state.radiusWallRatio * 100).toFixed(1) + '%';
    radiusSlider.value = (state.radiusWallRatio * 100).toFixed(1);
    chkShowContacts.checked = state.showContacts;
    imgZoomVal.textContent = bgImage ? Math.round(imgView.s * 100) + '%' : '画像なし';

    chkSquareWall.checked = state.lockWallRatio;
    chkShowEffective.checked = state.showEffective;
    obsCount.textContent = state.obstacles.length + '個';

    btnPlay.textContent = isPlaying ? '⏸ 停止' : '▶ 再生';
    btnPlay.classList.toggle('active-play', isPlaying);

    qbPlay.classList.toggle('active-play', isPlaying);
    animStatus.textContent = isPlaying ? `再生中 (${animSpeed}x)` : (animDistance > 0 ? '一時停止' : '停止中');
  }

  function resizeCanvas() {
    const rect = wrap.getBoundingClientRect();
    const aspect = CANVAS_W / CANVAS_H;
    let drawW = rect.width;
    let drawH = drawW / aspect;
    if (drawH > rect.height) {
      drawH = rect.height;
      drawW = drawH * aspect;
    }
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = Math.floor(drawW) + 'px';
    canvas.style.height = Math.floor(drawH) + 'px';
    canvas.width = Math.floor(drawW * dpr);
    canvas.height = Math.floor(drawH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if (state.lockWallRatio) {
      enforceWallAspect(Math.floor(drawW), Math.floor(drawH), 'center');
    }
    render();
  }

  window.addEventListener('resize', resizeCanvas);

  function drawDummyBackground(w, h) {
    ctx.fillStyle = '#151922';
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = '#222836';
    ctx.fillRect(0, 0, w, h * 0.13);
    ctx.fillStyle = '#8b9bb4';
    ctx.font = `bold ${Math.max(11, w * 0.032)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('【模擬ステージ画面】スクショ読込で実画面に切替', w * 0.5, h * 0.083);

    const wl = state.wall.left * w;
    const wr = state.wall.right * w;
    const wt = state.wall.top * h;
    const wb = state.wall.bottom * h;

    ctx.fillStyle = '#243038';
    ctx.fillRect(wl, wt, wr - wl, wb - wt);

    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 6; i++) {
      const gx = wl + (wr - wl) * (i / 6);
      ctx.beginPath(); ctx.moveTo(gx, wt); ctx.lineTo(gx, wb); ctx.stroke();
    }
    for (let j = 1; j < 6; j++) {
      const gy = wt + (wb - wt) * (j / 6);
      ctx.beginPath(); ctx.moveTo(wl, gy); ctx.lineTo(wr, gy); ctx.stroke();
    }

    ctx.fillStyle = '#1c212c';
    ctx.fillRect(0, h * 0.80, w, h * 0.20);
    for (let i = 0; i < 4; i++) {
      const bx = w * (0.06 + i * 0.23);
      const by = h * 0.82;
      const bw = w * 0.19;
      const bh = h * 0.11;
      ctx.fillStyle = '#2d3648';
      ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = i === 0 ? '#ff9800' : '#45526b';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, bw, bh);
    }
  }

  function segmentCircleIntersections(ax, ay, bx, by, cx, cy, r) {
    const dx = bx - ax;
    const dy = by - ay;
    const fx = ax - cx;
    const fy = ay - cy;
    const a = dx * dx + dy * dy;
    if (a < 1e-12) return [];
    const b = 2 * (fx * dx + fy * dy);
    const c = fx * fx + fy * fy - r * r;
    let disc = b * b - 4 * a * c;
    if (disc <= 0) return [];
    disc = Math.sqrt(disc);
    const rawT1 = (-b - disc) / (2 * a);
    const rawT2 = (-b + disc) / (2 * a);
    if (rawT2 < 0 || rawT1 > 1) return [];
    const t1 = Math.max(0, rawT1);
    const t2 = Math.min(1, rawT2);
    if (t2 - t1 < 1e-9) return [];
    return [{
      t1, t2,
      p1: { x: ax + dx * t1, y: ay + dy * t1 },
      p2: { x: ax + dx * t2, y: ay + dy * t2 }
    }];
  }

  function isInWallSegment(side, px, py, wl, wr, wt, wb) {
    const cfg = state.wallGimmicks[side];
    if (!cfg || cfg.type === 'none') return false;
    const s = Math.max(0, Math.min(1, cfg.start));
    const e = Math.max(s, Math.min(1, cfg.start + cfg.length));
    const tol = 1e-6;
    if (side === 'top' || side === 'bottom') {
      const ratio = (px - wl) / Math.max(1, wr - wl);
      return ratio >= s - tol && ratio <= e + tol;
    } else {
      const ratio = (py - wt) / Math.max(1, wb - wt);
      return ratio >= s - tol && ratio <= e + tol;
    }
  }

  function getBallRadiusPx(w) {
    return state.radiusWallRatio * (state.wall.right - state.wall.left) * w;
  }

  function rayCircle(cx, cy, vx, vy, ox, oy, R) {
    const fx = cx - ox;
    const fy = cy - oy;
    const b = fx * vx + fy * vy;
    const c = fx * fx + fy * fy - R * R;
    const disc = b * b - c;
    if (disc < 0) return Infinity;
    return -b - Math.sqrt(disc);
  }

  function rayRoundRect(cx, cy, vx, vy, rc, r, eps) {
    let best = { t: Infinity, nx: 0, ny: 0 };
    const tryT = (t, nx, ny) => { if (t > eps && t < best.t) best = { t, nx, ny }; };
    if (Math.abs(vx) > 1e-9) {
      const xs = vx > 0 ? rc.left - r : rc.right + r;
      const nx = vx > 0 ? -1 : 1;
      const t = (xs - cx) / vx;
      const y = cy + vy * t;
      if (y >= rc.top && y <= rc.bottom) tryT(t, nx, 0);
    }
    if (Math.abs(vy) > 1e-9) {
      const ys = vy > 0 ? rc.top - r : rc.bottom + r;
      const ny = vy > 0 ? -1 : 1;
      const t = (ys - cy) / vy;
      const x = cx + vx * t;
      if (x >= rc.left && x <= rc.right) tryT(t, 0, ny);
    }
    if (r > 0) {
      const corners = [[rc.left, rc.top], [rc.right, rc.top], [rc.left, rc.bottom], [rc.right, rc.bottom]];
      for (const [kx, ky] of corners) {
        const t = rayCircle(cx, cy, vx, vy, kx, ky, r);
        if (t > eps && t < best.t) {
          const hx = cx + vx * t;
          const hy = cy + vy * t;
          const inX = hx >= rc.left && hx <= rc.right;
          const inY = hy >= rc.top && hy <= rc.bottom;
          if (inX || inY) continue;
          const len = Math.hypot(hx - kx, hy - ky) || 1;
          best = { t, nx: (hx - kx) / len, ny: (hy - ky) / len };
        }
      }
    }
    return best;
  }

  function computeTrajectory(w, h) {
    const rPx = getBallRadiusPx(w);
    const wallLeft = state.wall.left * w;
    const wallRight = state.wall.right * w;
    const wallTop = state.wall.top * h;
    const wallBottom = state.wall.bottom * h;

    const minX = Math.min(wallLeft + rPx, (wallLeft + wallRight) / 2 - 1);
    const maxX = Math.max(wallRight - rPx, (wallLeft + wallRight) / 2 + 1);
    const minY = Math.min(wallTop + rPx, (wallTop + wallBottom) / 2 - 1);
    const maxY = Math.max(wallBottom - rPx, (wallTop + wallBottom) / 2 + 1);

    let cx = Math.max(minX, Math.min(maxX, state.ball.x * w));
    let cy = Math.max(minY, Math.min(maxY, state.ball.y * h));

    const rad = (state.angleDeg * Math.PI) / 180;
    let vx = Math.cos(rad);
    let vy = Math.sin(rad);

    const pierceHits = [];
    const events = [];
    const contacts = [];
    const isPierce = state.shotType === 'pierce';

    const touchedPuwSides = new Set();
    let hcwTouches = 0;
    let cumulativeDist = 0;
    let insideAtSegEnd = new Set();

    const circles = state.obstacles
      .filter(o => o.type === 'circle')
      .map(o => ({
        id: o.id,
        cx: o.x * w,
        cy: o.y * h,
        hitR: Math.max(2, o.r * w + rPx),
        visualR: Math.max(4, o.r * w)
      }));

    const rects = state.obstacles
      .filter(o => o.type === 'rect')
      .map(o => {
        const hw = Math.max(10, o.w * w) / 2;
        const hh = Math.max(10, o.h * h) / 2;
        const ox = o.x * w;
        const oy = o.y * h;
        return { id: o.id, left: ox - hw, right: ox + hw, top: oy - hh, bottom: oy + hh };
      });

    let pushedOut = false;
    for (let iter = 0; iter < 4; iter++) {
      let moved = false;
      if (!isPierce) {
        for (const cr of circles) {
          const d = Math.hypot(cx - cr.cx, cy - cr.cy);
          if (d < cr.hitR - 1e-6) {
            let nx = 0, ny = 1;
            if (d > 1e-6) { nx = (cx - cr.cx) / d; ny = (cy - cr.cy) / d; }
            cx = cr.cx + nx * (cr.hitR + 0.5);
            cy = cr.cy + ny * (cr.hitR + 0.5);
            moved = true;
          }
        }
      }
      for (const rc of rects) {
        const qx = Math.max(rc.left, Math.min(rc.right, cx));
        const qy = Math.max(rc.top, Math.min(rc.bottom, cy));
        const d = Math.hypot(cx - qx, cy - qy);
        if (d < rPx - 1e-6) {
          if (d > 1e-6) {
            cx = qx + (cx - qx) / d * (rPx + 0.5);
            cy = qy + (cy - qy) / d * (rPx + 0.5);
          } else {
            const cand = [
              { x: rc.left - rPx - 0.5, y: cy, d: cx - rc.left },
              { x: rc.right + rPx + 0.5, y: cy, d: rc.right - cx },
              { x: cx, y: rc.top - rPx - 0.5, d: cy - rc.top },
              { x: cx, y: rc.bottom + rPx + 0.5, d: rc.bottom - cy }
            ].sort((a, b) => a.d - b.d)[0];
            cx = cand.x; cy = cand.y;
          }
          moved = true;
        }
      }
      cx = Math.max(minX, Math.min(maxX, cx));
      cy = Math.max(minY, Math.min(maxY, cy));
      if (!moved) break;
      pushedOut = true;
    }

    const points = [{ x: cx, y: cy }];

    let bouncesDone = 0;
    const maxBounces = Math.max(1, Math.min(16, state.bounces));
    let guard = 0;

    while (bouncesDone < maxBounces && guard < 200) {
      guard++;
      const eps = 1e-4;
      let bestT = Infinity;
      let bestNormal = null;
      let hitWallSide = null;
      let hitEnemyCircle = null;
      let hitRect = null;

      if (vx > 1e-9) {
        const t = (maxX - cx) / vx;
        if (t > eps && t < bestT) { bestT = t; bestNormal = { nx: -1, ny: 0 }; hitWallSide = 'right'; }
      } else if (vx < -1e-9) {
        const t = (minX - cx) / vx;
        if (t > eps && t < bestT) { bestT = t; bestNormal = { nx: 1, ny: 0 }; hitWallSide = 'left'; }
      }
      if (vy > 1e-9) {
        const t = (maxY - cy) / vy;
        if (t > eps && t < bestT) { bestT = t; bestNormal = { nx: 0, ny: -1 }; hitWallSide = 'bottom'; }
      } else if (vy < -1e-9) {
        const t = (minY - cy) / vy;
        if (t > eps && t < bestT) { bestT = t; bestNormal = { nx: 0, ny: 1 }; hitWallSide = 'top'; }
      }

      for (const rc of rects) {
        const hit = rayRoundRect(cx, cy, vx, vy, rc, rPx, eps);
        if (hit.t < bestT) {
          bestT = hit.t;
          bestNormal = { nx: hit.nx, ny: hit.ny };
          hitWallSide = null;
          hitEnemyCircle = null;
          hitRect = rc;
        }
      }

      if (!isPierce) {
        for (const cr of circles) {
          const tHit = rayCircle(cx, cy, vx, vy, cr.cx, cr.cy, cr.hitR);
          if (tHit > eps && tHit < bestT) {
            const hx = cx + vx * tHit;
            const hy = cy + vy * tHit;
            const len = Math.hypot(hx - cr.cx, hy - cr.cy) || 1;
            bestT = tHit;
            bestNormal = { nx: (hx - cr.cx) / len, ny: (hy - cr.cy) / len };
            hitWallSide = null;
            hitRect = null;
            hitEnemyCircle = cr;
          }
        }
      }

      if (!isFinite(bestT) || !bestNormal) break;

      const nextX = cx + vx * bestT;
      const nextY = cy + vy * bestT;
      const segLen = Math.hypot(nextX - cx, nextY - cy);

      if (isPierce) {
        const segHitsAll = [];
        for (const cr of circles) {
          segmentCircleIntersections(cx, cy, nextX, nextY, cr.cx, cr.cy, cr.hitR)
            .forEach(sh => segHitsAll.push({ sh, cr }));
        }
        segHitsAll.sort((a, b) => a.sh.t1 - b.sh.t1);
        const nextInside = new Set();
        segHitsAll.forEach(({ sh, cr }) => {
          const hitDist = cumulativeDist + segLen * sh.t1;
          if (sh.t2 >= 1 - 1e-9) nextInside.add(cr.id);
          if (sh.t1 <= 1e-9 && insideAtSegEnd.has(cr.id)) {
            pierceHits.push({ p1: sh.p1, p2: sh.p2, obsId: cr.id, distAtHit: hitDist, cont: true });
            return;
          }
          pierceHits.push({ p1: sh.p1, p2: sh.p2, obsId: cr.id, distAtHit: hitDist });
          hcwTouches = 0;
          events.push({
            dist: hitDist,
            kind: 'enemy_reset',
            puwLv: Math.min(3, touchedPuwSides.size),
            hcwLv: 0
          });
        });
        insideAtSegEnd = nextInside;
      }

      cumulativeDist += segLen;
      cx = nextX;
      cy = nextY;
      points.push({ x: cx, y: cy });
      bouncesDone++;

      if (hitEnemyCircle) {
        contacts.push({
          kind: 'circle', x: cx, y: cy,
          nx: bestNormal.nx, ny: bestNormal.ny,
          ox: hitEnemyCircle.cx, oy: hitEnemyCircle.cy,
          dist: cumulativeDist
        });
        hcwTouches = 0;
        events.push({
          dist: cumulativeDist,
          kind: 'enemy_reset',
          puwLv: Math.min(3, touchedPuwSides.size),
          hcwLv: 0
        });
      } else if (hitRect) {
        contacts.push({ kind: 'rect', x: cx, y: cy, nx: bestNormal.nx, ny: bestNormal.ny, dist: cumulativeDist });
      }

      if (hitWallSide) {
        const gType = state.wallGimmicks[hitWallSide]?.type || 'none';
        const inSeg = isInWallSegment(hitWallSide, cx, cy, wallLeft, wallRight, wallTop, wallBottom);
        if (gType === 'puw' && inSeg) {
          touchedPuwSides.add(hitWallSide);
          events.push({
            dist: cumulativeDist, kind: 'puw', side: hitWallSide,
            puwLv: Math.min(3, touchedPuwSides.size), hcwLv: hcwTouches
          });
        } else if (gType === 'hcw' && inSeg) {
          hcwTouches = Math.min(4, hcwTouches + 1);
          events.push({
            dist: cumulativeDist, kind: 'hcw', side: hitWallSide,
            puwLv: Math.min(3, touchedPuwSides.size), hcwLv: hcwTouches
          });
        }
      }

      const dot = vx * bestNormal.nx + vy * bestNormal.ny;
      vx = vx - 2 * dot * bestNormal.nx;
      vy = vy - 2 * dot * bestNormal.ny;
      const vLen = Math.hypot(vx, vy) || 1;
      vx /= vLen;
      vy /= vLen;
    }

    events.sort((a, b) => a.dist - b.dist);

    const segments = [];
    let totalLength = 0;
    for (let i = 0; i < points.length - 1; i++) {
      const len = Math.hypot(points[i + 1].x - points[i].x, points[i + 1].y - points[i].y);
      segments.push({ a: points[i], b: points[i + 1], len, startDist: totalLength, endDist: totalLength + len });
      totalLength += len;
    }

    return {
      points, segments, totalLength, pierceHits, events, contacts, pushedOut,
      rPx, wallLeft, wallRight, wallTop, wallBottom,
      minX, maxX, minY, maxY
    };
  }

  function getAnimatedBallPos(sim, dist) {
    if (!sim.segments.length) return sim.points[0];
    const clamped = Math.max(0, Math.min(sim.totalLength, dist));
    for (const seg of sim.segments) {
      if (clamped <= seg.endDist || seg === sim.segments[sim.segments.length - 1]) {
        const ratio = seg.len > 1e-6 ? (clamped - seg.startDist) / seg.len : 0;
        return {
          x: seg.a.x + (seg.b.x - seg.a.x) * ratio,
          y: seg.a.y + (seg.b.y - seg.a.y) * ratio
        };
      }
    }
    return sim.points[sim.points.length - 1];
  }

  function tickAnim(now) {
    if (!isPlaying) return;
    if (lastFrameTime === null) lastFrameTime = now;
    const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
    lastFrameTime = now;

    const w = parseFloat(canvas.style.width) || canvas.width;
    const h = parseFloat(canvas.style.height) || canvas.height;
    const sim = computeTrajectory(w, h);
    const speedPxPerSec = w * 0.72 * animSpeed;
    animDistance += speedPxPerSec * dt;

    if (animDistance > sim.totalLength) {
      animDistance = 0;
    }
    render(sim);
    rafId = requestAnimationFrame(tickAnim);
  }

  function startAnim() {
    if (isPlaying) return;
    isPlaying = true;
    lastFrameTime = null;
    syncUI();
    rafId = requestAnimationFrame(tickAnim);
  }

  function stopAnim() {
    isPlaying = false;
    lastFrameTime = null;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    syncUI();
  }

  function resetAnim() {
    stopAnim();
    animDistance = 0;
    syncUI();
  }

  function drawWallGimmicks(sim, currentDist, isAnimActive) {
    const refDist = isAnimActive ? currentDist : Infinity;
    let curPuwLv = 0;
    let curHcwLv = 0;
    sim.events.forEach(ev => {
      if (ev.dist <= refDist) {
        curPuwLv = ev.puwLv;
        curHcwLv = ev.hcwLv;
      }
    });

    const puwLvColors = ['#90a4ae', '#ffeb3b', '#ff9800', '#ff1744'];
    const puwCol = puwLvColors[Math.min(3, curPuwLv)];

    ['top', 'bottom', 'left', 'right'].forEach(side => {
      const cfg = state.wallGimmicks[side];
      if (!cfg || cfg.type === 'none') return;

      const s = Math.max(0, Math.min(1, cfg.start));
      const e = Math.max(s, Math.min(1, cfg.start + cfg.length));

      let x1, y1, x2, y2, lx, ly;
      if (side === 'top') {
        const span = sim.wallRight - sim.wallLeft;
        x1 = sim.wallLeft + span * s; x2 = sim.wallLeft + span * e;
        y1 = y2 = sim.wallTop;
        lx = (x1 + x2) / 2; ly = sim.wallTop + 12;
      } else if (side === 'bottom') {
        const span = sim.wallRight - sim.wallLeft;
        x1 = sim.wallLeft + span * s; x2 = sim.wallLeft + span * e;
        y1 = y2 = sim.wallBottom;
        lx = (x1 + x2) / 2; ly = sim.wallBottom - 12;
      } else if (side === 'left') {
        const span = sim.wallBottom - sim.wallTop;
        x1 = x2 = sim.wallLeft;
        y1 = sim.wallTop + span * s; y2 = sim.wallTop + span * e;
        lx = sim.wallLeft + 26; ly = (y1 + y2) / 2;
      } else {
        const span = sim.wallBottom - sim.wallTop;
        x1 = x2 = sim.wallRight;
        y1 = sim.wallTop + span * s; y2 = sim.wallTop + span * e;
        lx = sim.wallRight - 26; ly = (y1 + y2) / 2;
      }

      ctx.save();
      if (cfg.type === 'puw') {
        ctx.strokeStyle = puwCol;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        ctx.fillStyle = puwCol;
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`PUW(Lv.${curPuwLv})`, lx, ly);
      } else if (cfg.type === 'hcw') {
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 5;
        ctx.setLineDash([8, 4]);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#00e5ff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`HCW(${curHcwLv}/4)`, lx, ly);
      }
      ctx.restore();
    });

    const hasPuw = Object.values(state.wallGimmicks).some(g => g.type === 'puw');
    const hasHcw = Object.values(state.wallGimmicks).some(g => g.type === 'hcw');
    const parts = [];
    if (hasPuw) parts.push(`<span style="color:${puwCol};font-weight:bold;">PUW: Lv.${curPuwLv}/3</span>`);
    if (hasHcw) parts.push(`<span style="color:#00e5ff;font-weight:bold;">HCW: ${curHcwLv}/4触れ</span>`);
    if (state.shotType === 'pierce') {
      const hitCount = isAnimActive
        ? sim.pierceHits.filter(h => !h.cont && h.distAtHit <= refDist).length
        : sim.pierceHits.filter(h => !h.cont).length;
      if (!state.practiceMode || isAnimActive) {
        parts.push(`<span style="color:#69f0ae;font-weight:bold;">貫通HIT: ${hitCount}回</span>`);
      }
    }
    hudGimmick.innerHTML = parts.join(' / ');
  }

  function render(precomputedSim = null) {
    const w = parseFloat(canvas.style.width) || canvas.width;
    const h = parseFloat(canvas.style.height) || canvas.height;
    ctx.clearRect(0, 0, w, h);

    if (bgImage) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, w, h);
      const dw = imgView.s * w;
      const dh = dw * (bgImage.naturalHeight / bgImage.naturalWidth);
      ctx.drawImage(bgImage, imgView.x * w, imgView.y * h, dw, dh);
    } else {
      drawDummyBackground(w, h);
    }

    const sim = precomputedSim || computeTrajectory(w, h);
    const isPierce = state.shotType === 'pierce';
    const isAnimActive = isPlaying || animDistance > 0;
    const showPrediction = !state.practiceMode;

    ctx.save();

    state.obstacles.forEach((o, idx) => {
      const isSelected = o.id === selectedObsId;
      const lbl = o.label || (o.type === 'circle' ? '敵' + (idx + 1) : 'ブロック');
      if (o.type === 'circle') {
        const ox = o.x * w;
        const oy = o.y * h;
        const r = Math.max(4, o.r * w);

        ctx.beginPath();
        ctx.arc(ox, oy, r, 0, Math.PI * 2);
        ctx.fillStyle = isPierce ? 'rgba(229, 57, 53, 0.42)' : 'rgba(229, 57, 53, 0.65)';
        ctx.fill();
        ctx.lineWidth = isSelected ? 3 : 2;
        ctx.strokeStyle = isSelected ? '#00e5ff' : 'rgba(255,255,255,0.65)';
        ctx.stroke();

        if (sim.rPx > 1 && showPrediction) {
          ctx.beginPath();
          ctx.arc(ox, oy, r + sim.rPx, 0, Math.PI * 2);
          ctx.strokeStyle = isPierce ? 'rgba(105, 240, 174, 0.35)' : 'rgba(255, 235, 59, 0.25)';
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 3]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(10, Math.min(13, r * 0.38))}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(lbl, ox, oy);

        if (mode === 'obs' && isSelected) {
          ctx.beginPath();
          ctx.arc(ox + r, oy, 6, 0, Math.PI * 2);
          ctx.fillStyle = '#00e5ff';
          ctx.fill();
          ctx.strokeStyle = '#0a0c10';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      } else if (o.type === 'rect') {
        const ox = o.x * w;
        const oy = o.y * h;
        const rw = Math.max(10, o.w * w);
        const rh = Math.max(10, o.h * h);
        const left = ox - rw / 2;
        const top = oy - rh / 2;

        ctx.fillStyle = 'rgba(120, 144, 156, 0.72)';
        ctx.fillRect(left, top, rw, rh);
        ctx.lineWidth = isSelected ? 3 : 2;
        ctx.strokeStyle = isSelected ? '#00e5ff' : '#cfd8dc';
        ctx.strokeRect(left, top, rw, rh);

        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(9, Math.min(12, rh * 0.55))}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(lbl, ox, oy);

        if (mode === 'obs' && isSelected) {
          const handles = [
            { x: ox + rw / 2, y: oy },
            { x: ox, y: oy + rh / 2 }
          ];
          handles.forEach(pt => {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#00e5ff';
            ctx.fill();
            ctx.strokeStyle = '#0a0c10';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          });
        }
      }
    });

    ctx.strokeStyle = mode === 'wall' ? '#00e5ff' : 'rgba(0, 188, 212, 0.75)';
    ctx.lineWidth = mode === 'wall' ? 2.5 : 1.5;
    ctx.strokeRect(sim.wallLeft, sim.wallTop, sim.wallRight - sim.wallLeft, sim.wallBottom - sim.wallTop);

    drawWallGimmicks(sim, animDistance, isAnimActive);

    if (state.showEffective && sim.rPx > 1 && showPrediction) {
      ctx.strokeStyle = 'rgba(105, 240, 174, 0.45)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(sim.minX, sim.minY, sim.maxX - sim.minX, sim.maxY - sim.minY);
      ctx.setLineDash([]);
    }

    if (mode === 'wall') {
      const handles = getWallHandles(w, h);
      ctx.fillStyle = '#00e5ff';
      ctx.strokeStyle = '#0a0c10';
      ctx.lineWidth = 2;
      Object.values(handles).forEach(pt => {
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });
    }

    const pts = sim.points;
    if (showPrediction) {
      if (pts.length >= 2) {
        for (let i = 0; i < pts.length - 1; i++) {
          const alpha = Math.max(0.25, 0.95 - i * 0.045);
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[i + 1].x, pts[i + 1].y);
          ctx.strokeStyle = i === 0 ? '#ffeb3b' : `rgba(255, 152, 0, ${alpha})`;
          ctx.lineWidth = i === 0 ? 3 : 2.2;
          ctx.stroke();

          if (i > 0) {
            ctx.beginPath();
            ctx.arc(pts[i].x, pts[i].y, 3.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ff9800';
            ctx.fill();
          }
        }
      }
    } else if (isAnimActive && sim.segments.length > 0) {
      for (const seg of sim.segments) {
        if (animDistance <= seg.startDist) break;
        const endRatio = Math.min(1, (animDistance - seg.startDist) / (seg.len || 1));
        ctx.beginPath();
        ctx.moveTo(seg.a.x, seg.a.y);
        ctx.lineTo(
          seg.a.x + (seg.b.x - seg.a.x) * endRatio,
          seg.a.y + (seg.b.y - seg.a.y) * endRatio
        );
        ctx.strokeStyle = 'rgba(244, 143, 177, 0.85)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }
    }

    if (isPierce && sim.pierceHits.length > 0) {
      let hitNo = 0;
      sim.pierceHits.forEach((hit) => {
        if (!hit.cont) hitNo++;
        if (!showPrediction && (!isAnimActive || hit.distAtHit > animDistance)) return;
        ctx.beginPath();
        ctx.moveTo(hit.p1.x, hit.p1.y);
        ctx.lineTo(hit.p2.x, hit.p2.y);
        ctx.strokeStyle = '#69f0ae';
        ctx.lineWidth = 4.5;
        ctx.stroke();

        if (hit.cont) return;
        ctx.beginPath();
        ctx.arc(hit.p1.x, hit.p1.y, 5.5, 0, Math.PI * 2);
        ctx.fillStyle = '#69f0ae';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#08150e';
        ctx.stroke();

        ctx.fillStyle = '#69f0ae';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'bottom';
        ctx.fillText(`#${hitNo}`, hit.p1.x + 7, hit.p1.y - 3);
      });
    }

    if (showPrediction && state.showContacts && sim.contacts.length > 0) {
      sim.contacts.forEach(c => {
        const sx = c.x - c.nx * sim.rPx;
        const sy = c.y - c.ny * sim.rPx;
        ctx.save();
        ctx.beginPath();
        ctx.arc(c.x, c.y, Math.max(3, sim.rPx), 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 1.2;
        ctx.setLineDash([3, 3]);
        ctx.stroke();
        ctx.setLineDash([]);
        const ext = Math.max(18, sim.rPx * 1.6);
        ctx.beginPath();
        if (c.kind === 'circle') ctx.moveTo(c.ox, c.oy); else ctx.moveTo(sx, sy);
        ctx.lineTo(c.x + c.nx * ext, c.y + c.ny * ext);
        ctx.strokeStyle = 'rgba(0, 229, 255, 0.85)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(sx, sy, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#00e5ff';
        ctx.fill();
        ctx.restore();
      });
    }
    if (sim.pushedOut) {
      hudGimmick.innerHTML += (hudGimmick.innerHTML ? ' / ' : '') +
        '<span style="color:#ff8a80;font-weight:bold;">⚠ 重なり→押し出して計算</span>';
    }

    const startPt = pts[0];
    const rad = (state.angleDeg * Math.PI) / 180;
    const pullLen = Math.min(w, h) * 0.14;

    ctx.beginPath();
    ctx.moveTo(startPt.x, startPt.y);
    ctx.lineTo(startPt.x - Math.cos(rad) * pullLen, startPt.y - Math.sin(rad) * pullLen);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
    ctx.lineWidth = 2.2;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    const shortArrowLen = Math.min(w, h) * 0.12;
    ctx.beginPath();
    ctx.moveTo(startPt.x, startPt.y);
    ctx.lineTo(startPt.x + Math.cos(rad) * shortArrowLen, startPt.y + Math.sin(rad) * shortArrowLen);
    ctx.strokeStyle = isPierce ? 'rgba(105, 240, 174, 0.8)' : 'rgba(255, 235, 59, 0.85)';
    ctx.lineWidth = 3;
    ctx.stroke();

    const drawR = Math.max(6, sim.rPx);
    ctx.beginPath();
    ctx.arc(startPt.x, startPt.y, drawR, 0, Math.PI * 2);
    ctx.strokeStyle = isPierce ? 'rgba(105, 240, 174, 0.45)' : 'rgba(255, 235, 59, 0.45)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const activePos = isAnimActive ? getAnimatedBallPos(sim, animDistance) : startPt;
    ctx.beginPath();
    ctx.arc(activePos.x, activePos.y, drawR, 0, Math.PI * 2);
    ctx.fillStyle = isPierce ? 'rgba(105, 240, 174, 0.38)' : 'rgba(255, 235, 59, 0.38)';
    ctx.fill();
    ctx.strokeStyle = isPierce ? '#69f0ae' : '#ffeb3b';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(activePos.x, activePos.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    ctx.restore();
    positionOverlays();
  }

  function getWallHandles(w, h) {
    const l = state.wall.left * w;
    const r = state.wall.right * w;
    const t = state.wall.top * h;
    const b = state.wall.bottom * h;
    const mx = (l + r) / 2;
    const my = (t + b) / 2;
    return {
      tl: { x: l, y: t }, tr: { x: r, y: t },
      bl: { x: l, y: b }, br: { x: r, y: b },
      top: { x: mx, y: t }, bottom: { x: mx, y: b },
      left: { x: l, y: my }, right: { x: r, y: my }
    };
  }

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: e.clientX - rect.left,
      y: e.clientY - rect.top,
      w: rect.width,
      h: rect.height
    };
  }

  function hitTestObstacle(px, py, w, h) {
    if (selectedObsId) {
      const sel = state.obstacles.find(o => o.id === selectedObsId);
      if (sel) {
        const ox = sel.x * w;
        const oy = sel.y * h;
        if (sel.type === 'circle') {
          const r = Math.max(4, sel.r * w);
          if (Math.hypot(px - (ox + r), py - oy) <= 22) return { obs: sel, handle: 'r' };
        } else if (sel.type === 'rect') {
          const rw = Math.max(10, sel.w * w);
          const rh = Math.max(10, sel.h * h);
          if (Math.hypot(px - (ox + rw / 2), py - oy) <= 22) return { obs: sel, handle: 'w' };
          if (Math.hypot(px - ox, py - (oy + rh / 2)) <= 22) return { obs: sel, handle: 'h' };
        }
      }
    }

    for (let i = state.obstacles.length - 1; i >= 0; i--) {
      const o = state.obstacles[i];
      const ox = o.x * w;
      const oy = o.y * h;
      if (o.type === 'circle') {
        const r = Math.max(8, o.r * w);
        if (Math.hypot(px - ox, py - oy) <= r + 6) return { obs: o, handle: 'move' };
      } else if (o.type === 'rect') {
        const rw = Math.max(14, o.w * w);
        const rh = Math.max(14, o.h * h);
        if (Math.abs(px - ox) <= rw / 2 + 6 && Math.abs(py - oy) <= rh / 2 + 6) return { obs: o, handle: 'move' };
      }
    }
    return null;
  }

  function zoomImageAt(px, py, factor, w, h) {
    if (!bgImage) return;
    const newS = Math.max(0.05, Math.min(20, imgView.s * factor));
    const f = newS / imgView.s;
    const ix = imgView.x * w;
    const iy = imgView.y * h;
    imgView = { s: newS, x: (px - (px - ix) * f) / w, y: (py - (py - iy) * f) / h };
    syncUI();
    render();
  }
  function fitImage(how) {
    if (!bgImage) return;
    const w = parseFloat(canvas.style.width) || canvas.width;
    const h = parseFloat(canvas.style.height) || canvas.height;
    const ar = bgImage.naturalHeight / bgImage.naturalWidth;
    const s = how === 'height' ? (h / ar) / w : 1;
    const dw = s * w;
    const dh = dw * ar;
    imgView = { s, x: (w - dw) / 2 / w, y: (h - dh) / 2 / h };
    syncUI();
    render();
  }
  canvas.addEventListener('wheel', (e) => {
    if (mode !== 'img' || !bgImage) return;
    e.preventDefault();
    const pos = getCanvasPos(e);
    const step = e.shiftKey ? 1.01 : 1.1;
    zoomImageAt(pos.x, pos.y, e.deltaY < 0 ? step : 1 / step, pos.w, pos.h);
  }, { passive: false });

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    const pos = getCanvasPos(e);
    isDragging = true;
    dragStart = { x: pos.x, y: pos.y };
    activePointers.set(e.pointerId, { x: pos.x, y: pos.y });

    if (mode === 'img') {
      if (activePointers.size >= 2) {
        const [p1, p2] = [...activePointers.values()];
        pinchStart = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y) || 1, s: imgView.s };
        imgDragStart = null;
      } else {
        imgDragStart = { x: pos.x, y: pos.y, view: { ...imgView } };
      }
      return;
    }

    if (mode === 'ball') {
      state.ball.x = Math.max(0.02, Math.min(0.98, pos.x / pos.w));
      state.ball.y = Math.max(0.02, Math.min(0.98, pos.y / pos.h));
      resetAnim();
      saveState();
      render();
    } else if (mode === 'wall') {
      const handles = getWallHandles(pos.w, pos.h);
      activeWallHandle = null;
      let minDist = 28;
      for (const [key, pt] of Object.entries(handles)) {
        const d = Math.hypot(pos.x - pt.x, pos.y - pt.y);
        if (d < minDist) { minDist = d; activeWallHandle = key; }
      }
      startWall = { ...state.wall };
      startScene = snapshotScene();
    } else if (mode === 'obs') {
      const hit = hitTestObstacle(pos.x, pos.y, pos.w, pos.h);
      if (hit) {
        selectedObsId = hit.obs.id;
        activeObsHandle = hit.handle;
        startObs = { ...hit.obs };
      } else {
        selectedObsId = null;
        activeObsHandle = null;
      }
      render();
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    e.preventDefault();
    const pos = getCanvasPos(e);
    if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, { x: pos.x, y: pos.y });

    if (mode === 'img') {
      if (!bgImage) return;
      if (activePointers.size >= 2 && pinchStart) {
        const [p1, p2] = [...activePointers.values()];
        const d = Math.hypot(p1.x - p2.x, p1.y - p2.y) || 1;
        const target = pinchStart.s * (d / pinchStart.d);
        zoomImageAt((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, target / imgView.s, pos.w, pos.h);
      } else if (imgDragStart) {
        imgView = {
          ...imgView,
          x: imgDragStart.view.x + (pos.x - imgDragStart.x) / pos.w,
          y: imgDragStart.view.y + (pos.y - imgDragStart.y) / pos.h
        };
        render();
      }
      return;
    }

    if (mode === 'ball') {
      state.ball.x = Math.max(0.02, Math.min(0.98, pos.x / pos.w));
      state.ball.y = Math.max(0.02, Math.min(0.98, pos.y / pos.h));
      animDistance = 0;
      render();
    } else if (mode === 'wall' && activeWallHandle && startWall) {
      const dx = (pos.x - dragStart.x) / pos.w;
      const dy = (pos.y - dragStart.y) / pos.h;
      const wObj = { ...startWall };
      const minGap = 0.12;
      const HANDLE_EDGES = {
        tl: ['l', 't'], tr: ['r', 't'], bl: ['l', 'b'], br: ['r', 'b'],
        top: ['t'], bottom: ['b'], left: ['l'], right: ['r']
      };
      const edges = HANDLE_EDGES[activeWallHandle] || [];
      if (edges.includes('l')) wObj.left = Math.max(0, Math.min(startWall.right - minGap, startWall.left + dx));
      if (edges.includes('r')) wObj.right = Math.min(1, Math.max(startWall.left + minGap, startWall.right + dx));
      if (edges.includes('t')) wObj.top = Math.max(0, Math.min(startWall.bottom - minGap, startWall.top + dy));
      if (edges.includes('b')) wObj.bottom = Math.min(1, Math.max(startWall.top + minGap, startWall.bottom + dy));

      if (state.lockWallRatio) {
        const anchor = edges.includes('t') ? 'top' :
                       edges.includes('b') ? 'bottom' :
                       edges.includes('l') ? 'left' :
                       edges.includes('r') ? 'right' : 'center';
        enforceWallAspect(pos.w, pos.h, anchor, wObj, startWall, startScene);
      } else {
        setWall(wObj, startWall, startScene);
      }
      animDistance = 0;
      render();
    } else if (mode === 'obs' && selectedObsId && activeObsHandle && startObs) {
      const target = state.obstacles.find(o => o.id === selectedObsId);
      if (!target) return;
      const dx = (pos.x - dragStart.x) / pos.w;
      const dy = (pos.y - dragStart.y) / pos.h;

      if (activeObsHandle === 'move') {
        target.x = Math.max(0.02, Math.min(0.98, startObs.x + dx));
        target.y = Math.max(0.02, Math.min(0.98, startObs.y + dy));
      } else if (activeObsHandle === 'r') {
        target.r = Math.max(0.015, Math.min(0.30, startObs.r + dx));
      } else if (activeObsHandle === 'w') {
        target.w = Math.max(0.03, Math.min(0.80, startObs.w + dx * 2));
      } else if (activeObsHandle === 'h') {
        target.h = Math.max(0.02, Math.min(0.50, startObs.h + dy * 2));
      }
      render();
    } else if (mode === 'pull') {
      const dx = pos.x - dragStart.x;
      const dy = pos.y - dragStart.y;
      if (Math.hypot(dx, dy) > 8) {
        const rad = Math.atan2(-dy, -dx);
        state.angleDeg = quantizeAngle((rad * 180) / Math.PI);
        animDistance = 0;
        syncUI();
        render();
      }
    }
  });

  function endDrag(e) {
    if (e && e.pointerId !== undefined) activePointers.delete(e.pointerId);
    if (activePointers.size < 2) pinchStart = null;
    if (mode === 'img' && activePointers.size === 1) {
      const p = [...activePointers.values()][0];
      imgDragStart = { x: p.x, y: p.y, view: { ...imgView } };
      return;
    }
    imgDragStart = null;
    if (!isDragging) return;
    isDragging = false;
    activeWallHandle = null;
    activeObsHandle = null;
    saveState();
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  btnPlay.addEventListener('click', () => {
    if (isPlaying) stopAnim();
    else startAnim();
  });

  document.getElementById('btnResetAnim').addEventListener('click', () => {
    resetAnim();
    render();
  });

  speedSelect.addEventListener('change', () => {
    animSpeed = parseFloat(speedSelect.value) || 1.0;
    syncUI();
  });

  btnReflect.addEventListener('click', () => {
    state.shotType = 'reflect';
    resetAnim();
    syncUI();
    saveState();
    render();
  });

  btnPierce.addEventListener('click', () => {
    state.shotType = 'pierce';
    resetAnim();
    syncUI();
    saveState();
    render();
  });

  btnPractice.addEventListener('click', () => {
    state.practiceMode = !state.practiceMode;
    resetAnim();
    syncUI();
    saveState();
    render();
  });

  document.getElementById('clearWallGimmick').addEventListener('click', () => {
    state.wallGimmicks = makeDefaultWallGimmicks();
    buildWallGimmickUI();
    saveState();
    render();
  });

  const modeBtns = {
    pull: document.getElementById('modePull'),
    ball: document.getElementById('modeBall'),
    obs: document.getElementById('modeObs'),
    wall: document.getElementById('modeWall'),
    img: document.getElementById('modeImg')
  };
  const modeTexts = {
    pull: '画面のどこでもドラッグで引っ張り方向を調整',
    ball: 'タップ／ドラッグで発射キャラの位置を移動',
    obs: '障害物をドラッグ移動／水色ハンドルでサイズ変更',
    wall: '青いハンドルで壁枠を合わせる（中身も追従）',
    img: '画像をドラッグ移動／ホイール・ピンチで拡大縮小'
  };

  function setMode(newMode) {
    mode = newMode;
    Object.entries(modeBtns).forEach(([k, btn]) => {
      btn.classList.toggle('active', k === newMode);
    });
    modeDesc.textContent = modeTexts[newMode];
    document.querySelectorAll('.qb[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === newMode));
    showModeToast();
    render();
  }

  modeBtns.pull.addEventListener('click', () => setMode('pull'));
  modeBtns.ball.addEventListener('click', () => setMode('ball'));
  modeBtns.obs.addEventListener('click', () => setMode('obs'));
  modeBtns.wall.addEventListener('click', () => setMode('wall'));
  modeBtns.img.addEventListener('click', () => setMode('img'));
  document.getElementById('imgFitW').addEventListener('click', () => fitImage('width'));
  document.getElementById('imgFitH').addEventListener('click', () => fitImage('height'));
  const zoomCenter = (f) => {
    const w = parseFloat(canvas.style.width) || canvas.width;
    const h = parseFloat(canvas.style.height) || canvas.height;
    zoomImageAt(w / 2, h / 2, f, w, h);
  };
  document.getElementById('imgZoomIn').addEventListener('click', () => zoomCenter(1.05));
  document.getElementById('imgZoomOut').addEventListener('click', () => zoomCenter(1 / 1.05));
  chkShowContacts.addEventListener('change', () => {
    state.showContacts = chkShowContacts.checked;
    saveState();
    render();
  });

  document.getElementById('addCircle').addEventListener('click', () => {
    const id = 'o_' + Date.now() + '_' + Math.floor(Math.random() * 100);
    state.obstacles.push({ id, type: 'circle', x: 0.5, y: 0.42, r: 0.055, label: '敵' });
    selectedObsId = id;
    setMode('obs');
    syncUI();
    saveState();
    render();
  });

  document.getElementById('addRect').addEventListener('click', () => {
    const id = 'o_' + Date.now() + '_' + Math.floor(Math.random() * 100);
    state.obstacles.push({ id, type: 'rect', x: 0.5, y: 0.48, w: 0.22, h: 0.032, label: 'ブロック' });
    selectedObsId = id;
    setMode('obs');
    syncUI();
    saveState();
    render();
  });

  document.getElementById('delObs').addEventListener('click', () => {
    if (!selectedObsId) return;
    state.obstacles = state.obstacles.filter(o => o.id !== selectedObsId);
    selectedObsId = state.obstacles.length > 0 ? state.obstacles[state.obstacles.length - 1].id : null;
    syncUI();
    saveState();
    render();
  });

  document.getElementById('clearObs').addEventListener('click', () => {
    state.obstacles = [];
    selectedObsId = null;
    syncUI();
    saveState();
    render();
  });

  stepSelect.addEventListener('change', () => {
    state.angleStep = parseFloat(stepSelect.value);
    state.angleDeg = quantizeAngle(state.angleDeg);
    buildFineButtons();
    syncUI();
    saveState();
    render();
  });

  angleSlider.addEventListener('input', () => {
    state.angleDeg = quantizeAngle(parseFloat(angleSlider.value));
    animDistance = 0;
    syncUI();
    render();
  });
  angleSlider.addEventListener('change', saveState);

  bounceSlider.addEventListener('input', () => {
    state.bounces = Math.max(1, Math.min(16, parseInt(bounceSlider.value, 10)));
    animDistance = 0;
    syncUI();
    render();
  });
  bounceSlider.addEventListener('change', saveState);

  radiusSlider.addEventListener('input', () => {
    state.radiusWallRatio = parseFloat(radiusSlider.value) / 100;
    animDistance = 0;
    syncUI();
    render();
  });
  radiusSlider.addEventListener('change', saveState);

  chkSquareWall.addEventListener('change', () => {
    state.lockWallRatio = chkSquareWall.checked;
    const wPx = parseFloat(canvas.style.width) || canvas.width;
    const hPx = parseFloat(canvas.style.height) || canvas.height;
    if (state.lockWallRatio) enforceWallAspect(wPx, hPx, 'center');
    resetAnim();
    saveState();
    render();
  });

  chkShowEffective.addEventListener('change', () => {
    state.showEffective = chkShowEffective.checked;
    saveState();
    render();
  });

  document.getElementById('presetIphone').addEventListener('click', () => {
    state.lockWallRatio = true;
    const fromWall = { ...state.wall };
    const scene = snapshotScene();
    const targetWall = { left: 0.042, right: 0.958, top: 0.224, bottom: 0.699 };
    const wPx = parseFloat(canvas.style.width) || canvas.width;
    const hPx = parseFloat(canvas.style.height) || canvas.height;
    enforceWallAspect(wPx, hPx, 'center', targetWall, fromWall, scene);
    resetAnim();
    syncUI();
    saveState();
    render();
  });

  document.getElementById('presetSquareCenter').addEventListener('click', () => {
    state.lockWallRatio = true;
    const fromWall = { ...state.wall };
    const scene = snapshotScene();
    const targetWall = { left: 0.05, right: 0.95, top: 0.20, bottom: 0.80 };
    const wPx = parseFloat(canvas.style.width) || canvas.width;
    const hPx = parseFloat(canvas.style.height) || canvas.height;
    enforceWallAspect(wPx, hPx, 'center', targetWall, fromWall, scene);
    resetAnim();
    syncUI();
    saveState();
    render();
  });

  function loadImageFromFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        bgImage = img;
        resetAnim();
        fitImage('width');
        setMode('img');
        syncUI();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('fileInput').addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) loadImageFromFile(e.target.files[0]);
    e.target.value = '';
  });

  document.getElementById('btnDummy').addEventListener('click', () => {
    bgImage = null;
    imgView = { x: 0, y: 0, s: 1 };
    resetAnim();
    syncUI();
    render();
  });

  window.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        loadImageFromFile(item.getAsFile());
        break;
      }
    }
  });

  wrap.addEventListener('dragover', (e) => e.preventDefault());
  wrap.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files && e.dataTransfer.files[0]) loadImageFromFile(e.dataTransfer.files[0]);
  });

  // =========================================================================
  // レイアウト：全画面キャンバス＋収納式設定パネル＋クイックバー
  // =========================================================================
  const appEl = document.getElementById('app');
  const settingsPanel = document.getElementById('settingsPanel');
  const PANEL_KEY = 'monst_sim_panel_open';
  const isWide = () => window.matchMedia('(min-width: 900px)').matches;

  safeProbe = document.createElement('div');
  safeProbe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);';
  document.body.appendChild(safeProbe);
  function safeInsets() {
    const cs = getComputedStyle(safeProbe);
    return { top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0 };
  }

  function positionOverlays() {
    const hudBadge = document.getElementById('hudBadge');
    const modeToast = document.getElementById('modeToast');
    const quickbar = document.getElementById('quickbar');
    if (!hudBadge || !safeProbe) return;
    const cTop = canvas.offsetTop;
    const cH = parseFloat(canvas.style.height) || 0;
    const wallTopPx = cTop + state.wall.top * cH;
    const wallBottomPx = cTop + state.wall.bottom * cH;
    const safe = safeInsets();
    const minTop = Math.max(4, safe.top + 2);
    const hudH = hudBadge.offsetHeight;
    let top = wallTopPx - hudH - 6;
    if (top < minTop) {
      top = wallBottomPx + 6;
    }
    hudBadge.style.top = top + 'px';
    const qbTop = quickbar.offsetTop;
    let tTop = top + hudH + 4;
    if (tTop + 26 > wallTopPx && tTop < wallBottomPx) tTop = qbTop - 32;
    modeToast.style.top = tTop + 'px';
  }

  let toastTimer = null;
  function showModeToast() {
    const modeToast = document.getElementById('modeToast');
    modeToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => modeToast.classList.remove('show'), 1800);
  }

  function setPanelOpen(open) {
    appEl.classList.toggle('panel-closed', !open);
    if (isWide()) localStorage.setItem(PANEL_KEY, open ? '1' : '0');
    requestAnimationFrame(resizeCanvas);
  }
  document.getElementById('qbSettings').addEventListener('click', () => {
    setPanelOpen(appEl.classList.contains('panel-closed'));
  });
  document.getElementById('btnClosePanel').addEventListener('click', () => setPanelOpen(false));
  document.getElementById('panelBackdrop').addEventListener('click', () => setPanelOpen(false));

  const btnPeek = document.getElementById('btnPeek');
  const peekOn = (e) => { e.preventDefault(); settingsPanel.classList.add('peek'); document.getElementById('panelBackdrop').style.opacity = '0'; };
  const peekOff = () => { settingsPanel.classList.remove('peek'); document.getElementById('panelBackdrop').style.opacity = ''; };
  btnPeek.addEventListener('pointerdown', peekOn);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btnPeek.addEventListener(ev, peekOff));
  if (!window.matchMedia('(max-width: 899px)').matches) btnPeek.style.display = 'none';

  document.querySelectorAll('.qb[data-mode]').forEach(b => {
    b.addEventListener('click', () => setMode(b.dataset.mode));
  });
  document.getElementById('qbPlay').addEventListener('click', () => btnPlay.click());

  function nudgeAngle(sign) {
    const step = state.angleStep || 0.25;
    state.angleDeg = quantizeAngle(state.angleDeg + sign * step);
    resetAnim();
    syncUI();
    render();
  }
  function bindRepeat(btn, sign) {
    let timer = null, count = 0;
    const stop = () => { if (timer) { clearTimeout(timer); timer = null; saveState(); } };
    const tick = () => {
      nudgeAngle(sign);
      count++;
      timer = setTimeout(tick, count < 6 ? 140 : count < 20 ? 70 : 30);
    };
    btn.addEventListener('pointerdown', (e) => { e.preventDefault(); count = 0; stop(); tick(); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
    btn.addEventListener('contextmenu', e => e.preventDefault());
  }
  bindRepeat(document.getElementById('qbMinus'), -1);
  bindRepeat(document.getElementById('qbPlus'), +1);

  if (window.ResizeObserver) new ResizeObserver(() => resizeCanvas()).observe(wrap);
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

  if (isWide() && localStorage.getItem(PANEL_KEY) !== '0') appEl.classList.remove('panel-closed');

  // 初期化
  refreshPresetDropdown();
  buildWallGimmickUI();
  buildFineButtons();
  syncUI();
  resizeCanvas();
})();
</script>
</body>
</html>
